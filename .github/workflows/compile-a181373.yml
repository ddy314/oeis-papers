name: Compile and publish A181373 PDF

on:
  push:
    branches:
      - main
    paths:
      - papers/A181373/main.tex
      - .github/workflows/compile-a181373.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Typeset A181373 paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: papers/A181373
          latexmk_use_xelatex: false
      - name: Commit generated PDF
        run: |
          test -s papers/A181373/main.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/A181373/main.pdf
          if ! git diff --cached --quiet; then
            git commit -m "paper: add compiled A181373 PDF"
            git push origin HEAD:main
          fi
