name: A087354 paper PDF build

on:
  push:
    branches:
      - paper/a087354-square-concatenation-extension
    paths:
      - papers/A087354/main.tex
      - papers/A087354/verify.py
      - .github/workflows/compile-a087354-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reproduce exact integer verification
        run: python papers/A087354/verify.py
      - name: Compile the two-page paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: papers/A087354
          latexmk_use_xelatex: false
      - name: Commit compiled PDF
        run: |
          test -s papers/A087354/main.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/A087354/main.pdf
          if ! git diff --cached --quiet; then
            git commit -m "paper: add typeset A087354/A391022 existence proof PDF"
            git push
          fi
