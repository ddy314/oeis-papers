name: One-time A069862 PDF build

on:
  push:
    branches:
      - paper/a069862-exact-minima-20261022
    paths:
      - 'papers/A069862/main.tex'
      - 'papers/A069862/verify.py'
      - '.github/workflows/a069862-one-time-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify exact modular identities
        run: python3 papers/A069862/verify.py

      - name: Compile A069862 paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: papers/A069862
          latexmk_use_xelatex: false

      - name: Check both authors are shown on PDF
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          test -s papers/A069862/main.pdf
          pdftotext -f 1 -l 1 papers/A069862/main.pdf - | grep -F 'Qichao Wang'
          pdftotext -f 1 -l 1 papers/A069862/main.pdf - | grep -F 'Daoyu Dong'
          pdfinfo papers/A069862/main.pdf | grep -F 'Pages:'

      - name: Commit the verified PDF to this branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          git add papers/A069862/main.pdf
          if ! git diff --cached --quiet; then
            git commit -m "paper: compile A069862 exact-minimum theorem PDF"
            git pull --rebase origin "$branch"
            git push origin "HEAD:$branch"
          fi
