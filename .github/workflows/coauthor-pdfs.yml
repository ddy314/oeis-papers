name: Rebuild coauthored OEIS paper PDFs

on:
  push:
    branches:
      - paper/add-daoyu-dong-coauthor-20261022
    paths:
      - 'papers/A006063/*.tex'
      - 'papers/A075018/main.tex'
      - 'papers/A077183-A077185/main.tex'
      - 'papers/A087354/main.tex'
      - '.github/workflows/coauthor-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build A006063 main paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: papers/A006063
          latexmk_use_xelatex: false

      - name: Build A006063 finite-case note
        uses: xu-cheng/latex-action@v4
        with:
          root_file: finite_base_note.tex
          working_directory: papers/A006063
          latexmk_use_xelatex: false

      - name: Build A075018
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: papers/A075018
          latexmk_use_xelatex: false

      - name: Build A077183-A077185
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: papers/A077183-A077185
          latexmk_use_xelatex: false

      - name: Build A087354
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: papers/A087354
          latexmk_use_xelatex: false

      - name: Check visible authors in all five PDFs
        run: |
          set -euo pipefail
          for pdf in papers/A006063/main.pdf papers/A006063/finite_base_note.pdf papers/A075018/main.pdf papers/A077183-A077185/main.pdf papers/A087354/main.pdf; do
            test -s "$pdf"
            pdftotext -f 1 -l 1 -layout "$pdf" - | grep -F 'Qichao Wang'
            pdftotext -f 1 -l 1 -layout "$pdf" - | grep -F 'Daoyu Dong'
            echo "PASS: $pdf"
          done

      - name: Commit compiled PDFs to this branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          git add papers/A006063/main.pdf papers/A006063/finite_base_note.pdf papers/A075018/main.pdf papers/A077183-A077185/main.pdf papers/A087354/main.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes"
            exit 0
          fi
          git commit -m "paper: compile five PDFs with Qichao Wang and Daoyu Dong"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
