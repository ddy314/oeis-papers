name: One-time A083468 exact-minimum PDF rebuild

on:
  push:
    branches:
      - paper/a083468-exact-minimum-powers-of-ten-20261022
    paths:
      - 'papers/A083468-A083469/main.tex'
      - 'papers/A083468-A083469/verify_reverse_concatenation.py'
      - '.github/workflows/a083468-minimum-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify existence witnesses and exact power-of-ten minima
        run: python3 papers/A083468-A083469/verify_reverse_concatenation.py

      - name: Rebuild revised A083468 and A083469 paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: papers/A083468-A083469
          latexmk_use_xelatex: false

      - name: Validate output PDF and theorem text
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdf="papers/A083468-A083469/main.pdf"
          test -s "$pdf"
          pdftotext "$pdf" - | grep -F 'Qichao Wang'
          pdftotext "$pdf" - | grep -F 'Exact minima at powers of the base'
          pdfinfo "$pdf" | grep -F 'Pages:'

      - name: Commit regenerated main.pdf
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          git add papers/A083468-A083469/main.pdf
          if ! git diff --cached --quiet; then
            git commit -m "paper: rebuild A083468 exact-minimum PDF"
            git pull --rebase origin "$branch"
            git push origin "HEAD:$branch"
          fi
